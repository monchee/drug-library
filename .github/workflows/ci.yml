name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build and Verify Protocols
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify protocols export is up to date
        run: |
          python scripts/export_protocols.py --check

      - name: Build MkDocs site
        run: |
          mkdocs build --strict

      - name: Clinical sign-off gate (version and date bump on protocol change)
        if: github.event_name == 'pull_request'
        run: |
          python3 - << 'EOF'
          import subprocess
          import sys
          import yaml
          from pathlib import Path

          base_ref = "origin/${{ github.base_ref }}"
          print(f"Checking drug page changes against base ref: {base_ref}")

          # Get changed drug files between base branch and PR HEAD
          try:
              res = subprocess.run(
                  ["git", "diff", f"{base_ref}...HEAD", "--name-only", "--", "docs/drugs/*.md"],
                  capture_output=True,
                  text=True,
                  check=True
              )
              changed_files = [
                  f.strip() for f in res.stdout.splitlines()
                  if f.strip().endswith(".md") and f.strip() != "docs/drugs/index.md"
              ]
          except Exception as e:
              print(f"Error checking git diff: {e}", file=sys.stderr)
              sys.exit(1)

          if not changed_files:
              print("No drug protocol pages modified in this PR. Sign-off gate passed.")
              sys.exit(0)

          def extract_frontmatter(text):
              if not text or not text.startswith("---"):
                  return {}
              parts = text.split("---", 2)
              if len(parts) < 3:
                  return {}
              try:
                  return yaml.safe_load(parts[1]) or {}
              except Exception:
                  return {}

          failed = []
          for fpath in changed_files:
              # Get base version if file existed in base branch
              base_show = subprocess.run(
                  ["git", "show", f"{base_ref}:{fpath}"],
                  capture_output=True,
                  text=True
              )
              base_fm = extract_frontmatter(base_show.stdout) if base_show.returncode == 0 else {}

              # Get current version from disk
              try:
                  curr_text = Path(fpath).read_text(encoding="utf-8")
                  curr_fm = extract_frontmatter(curr_text)
              except Exception as e:
                  print(f"Warning: Could not read {fpath}: {e}", file=sys.stderr)
                  continue

              base_protocols = base_fm.get("protocols")
              curr_protocols = curr_fm.get("protocols")

              # If protocols block changed or was added, both version and last_reviewed MUST be bumped
              if base_protocols != curr_protocols and curr_protocols is not None:
                  base_ver = str(base_fm.get("version", "")) if base_fm.get("version") is not None else ""
                  curr_ver = str(curr_fm.get("version", "")) if curr_fm.get("version") is not None else ""
                  base_date = str(base_fm.get("last_reviewed", "")) if base_fm.get("last_reviewed") is not None else ""
                  curr_date = str(curr_fm.get("last_reviewed", "")) if curr_fm.get("last_reviewed") is not None else ""

                  errors = []
                  if not curr_ver:
                      errors.append("version is missing")
                  elif base_ver and curr_ver == base_ver:
                      errors.append(f"version must be bumped (currently '{curr_ver}')")

                  if not curr_date:
                      errors.append("last_reviewed is missing")
                  elif base_date and curr_date == base_date:
                      errors.append(f"last_reviewed must be bumped (currently '{curr_date}')")

                  if errors:
                      failed.append((fpath, errors))

          if failed:
              print("\n" + "=" * 70, file=sys.stderr)
              print("CLINICAL SIGN-OFF GATE FAILED", file=sys.stderr)
              print("The following drug page(s) changed protocol data but did not bump required fields:", file=sys.stderr)
              for fpath, errs in failed:
                  print(f"  - {fpath}: {', '.join(errs)}", file=sys.stderr)
              print("\nClinical Policy: Changes to 'protocols:' require bumping both 'version' and 'last_reviewed'.", file=sys.stderr)
              print("=" * 70 + "\n", file=sys.stderr)
              sys.exit(1)

          print(f"Clinical sign-off gate passed: all {len(changed_files)} changed drug page(s) meet sign-off requirements.")
          EOF
